name: Docs

on:
  push:
    branches: [master]
    paths: ['docs/**', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'src/**', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

# `src/**` is a trigger because the demo page imports the hook source through a Vite alias, so a
# change to the library can break the docs build without docs/ being touched.

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # One install at the workspace root covers docs too, and is what keeps react to a single
      # copy. withastro/action is not used here because it installs inside its `path`, which no
      # longer has a lockfile of its own.
      - run: npm ci
      - run: npm run build --workspace docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy
    # Pull requests build only. Deploying from a branch would overwrite the live site with
    # unreviewed content.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
